name: Alpaca Credential Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  alpaca-credential-diagnostic:
    name: Safe Alpaca credential diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - name: Diagnose current Actions secrets without exposing them
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          raw_key = os.getenv("ALPACA_API_KEY_ID", "")
          raw_secret = os.getenv("ALPACA_SECRET_KEY", "")
          key = raw_key.strip()
          secret = raw_secret.strip()

          shape = {
              "api_key_present": bool(raw_key),
              "secret_present": bool(raw_secret),
              "api_key_has_outer_whitespace": raw_key != key,
              "secret_has_outer_whitespace": raw_secret != secret,
              "api_key_contains_assignment_prefix": key.upper().startswith("ALPACA_API_KEY_ID="),
              "secret_contains_assignment_prefix": secret.upper().startswith("ALPACA_SECRET_KEY="),
              "credential_family": (
                  "broker_client_candidate" if key.startswith("C") else "trading_api_candidate"
              ) if key else "missing",
          }

          print("credential_shape=" + json.dumps(shape, sort_keys=True))

          if not raw_key or not raw_secret:
              raise SystemExit("Required Alpaca Actions secrets are missing")

          def probe(name: str, url: str, api_key: str, secret_key: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "APCA-API-KEY-ID": api_key,
                      "APCA-API-SECRET-KEY": secret_key,
                      "Accept": "application/json",
                  },
              )
              status = None
              message = None
              code = None
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  try:
                      payload = json.loads(exc.read().decode("utf-8", errors="replace"))
                      message = payload.get("message")
                      code = payload.get("code")
                  except Exception:
                      message = exc.reason
              except Exception as exc:
                  message = f"{type(exc).__name__}: {exc}"

              result = {
                  "probe": name,
                  "http_status": status,
                  "alpaca_code": code,
                  "message": message,
              }
              print("probe_result=" + json.dumps(result, sort_keys=True))
              return status

          params = urllib.parse.urlencode(
              {
                  "timeframe": "1Day",
                  "start": "2026-08-14T04:00:00Z",
                  "end": "2026-08-15T04:00:00Z",
                  "limit": 1,
                  "adjustment": "all",
                  "feed": "iex",
                  "sort": "asc",
              }
          )
          market_data_url = f"https://data.alpaca.markets/v2/stocks/AAPL/bars?{params}"

          raw_market_status = probe(
              "market_data_raw",
              market_data_url,
              raw_key,
              raw_secret,
          )
          trimmed_market_status = probe(
              "market_data_trimmed",
              market_data_url,
              key,
              secret,
          )
          paper_status = probe(
              "paper_account_trimmed",
              "https://paper-api.alpaca.markets/v2/account",
              key,
              secret,
          )
          live_status = probe(
              "live_account_trimmed",
              "https://api.alpaca.markets/v2/account",
              key,
              secret,
          )

          diagnosis = {
              "raw_market_data_authenticated": raw_market_status == 200,
              "trimmed_market_data_authenticated": trimmed_market_status == 200,
              "paper_trading_authenticated": paper_status == 200,
              "live_trading_authenticated": live_status == 200,
              "outer_whitespace_is_root_cause": (
                  raw_market_status != 200 and trimmed_market_status == 200
              ),
          }
          print("diagnosis=" + json.dumps(diagnosis, sort_keys=True))

          if trimmed_market_status != 200:
              raise SystemExit(
                  "Current Alpaca Actions secret pair still cannot authenticate to Market Data"
              )
          PY
