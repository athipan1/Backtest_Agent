name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with branch coverage
        run: |
          python -m pytest -q \
            --cov=app \
            --cov=scripts \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-fail-under=90

      - name: Validate generated OpenAPI contract
        env:
          BACKTEST_API_KEY: ci-backtest-key
        run: |
          python - <<'PY'
          from openapi_spec_validator import validate
          from app.main import app

          document = app.openapi()
          validate(document)
          assert "/backtest/run" in document["paths"]
          assert "/backtest/multi-strategy/walk-forward" in document["paths"]
          print("OpenAPI contract is valid")
          PY

      - name: Upload coverage evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backtest-coverage-${{ matrix.python-version }}-${{ github.sha }}
          path: coverage-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 30

  lint-type-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check app scripts tests

      - name: MyPy promotion boundary
        run: |
          python -m mypy --follow-imports=silent \
            app/database_client.py \
            app/promotion_lifecycle.py \
            app/promotion_robustness.py \
            scripts/run_nested_hourly_backtest.py

      - name: Bandit
        # B311 is intentionally excluded only for seeded, reproducible Monte
        # Carlo and bootstrap simulations. These values are never used for
        # credentials, tokens, identifiers, signatures, or security decisions.
        run: python -m bandit -q -r app scripts -s B311

      - name: Dependency vulnerability audit
        run: python -m pip_audit --strict --desc

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment \
            --output-format JSON \
            --output-file backtest-agent.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path("backtest-agent.cdx.json").read_text())
          assert document.get("bomFormat") == "CycloneDX"
          assert document.get("components")
          print(f"SBOM components: {len(document['components'])}")
          PY

      - name: Upload security evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backtest-security-evidence-${{ github.sha }}
          path: backtest-agent.cdx.json
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build container
        run: docker build --pull -t backtest-agent-ci:${{ github.sha }} .

      - name: Verify non-root user and health check
        run: |
          test "$(docker image inspect backtest-agent-ci:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test -n "$(docker image inspect backtest-agent-ci:${{ github.sha }} --format '{{json .Config.Healthcheck.Test}}')"

      - name: Run healthy container
        run: |
          docker run -d --name backtest-agent-ci \
            -e BACKTEST_API_KEY=ci-backtest-key \
            -p 8016:8016 \
            backtest-agent-ci:${{ github.sha }}
          trap 'docker logs backtest-agent-ci || true; docker rm -f backtest-agent-ci || true' EXIT
          for attempt in $(seq 1 60); do
            running="$(docker inspect backtest-agent-ci --format '{{.State.Running}}')"
            if [ "$running" != "true" ]; then
              docker logs backtest-agent-ci
              exit 1
            fi
            status="$(docker inspect backtest-agent-ci --format '{{.State.Health.Status}}')"
            if [ "$status" = "healthy" ]; then
              curl --fail --silent http://127.0.0.1:8016/health >/dev/null
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs backtest-agent-ci
              exit 1
            fi
            sleep 2
          done
          docker logs backtest-agent-ci
          exit 1
