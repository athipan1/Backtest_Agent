name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. python -m pytest -q \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

  quality:
    name: Static quality and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff critical lint checks
        run: python -m ruff check app tests scripts

      - name: Type-check critical safety modules
        run: |
          python -m mypy \
            app/security.py \
            app/execution.py \
            app/execution_policy.py \
            app/run_identity.py \
            app/statistical_validation.py \
            app/observability.py \
            app/readiness.py

      - name: Bandit application scan
        run: python -m bandit -q -r app -ll

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.7.3

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt --strict

  container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --tag backtest-agent:ci .

      - name: Verify non-root runtime
        run: |
          test "$(docker image inspect backtest-agent:ci --format '{{.Config.User}}')" = "10001:10001"

      - name: Start and verify healthy container
        run: |
          container_id="$(docker run --detach --publish 8016:8016 backtest-agent:ci)"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${container_id}")"
            if [ "${health}" = "healthy" ]; then
              break
            fi
            if [ "${health}" = "unhealthy" ]; then
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")" = "healthy"
          curl --fail --silent --show-error http://127.0.0.1:8016/health > /tmp/health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/health.json').read_text())
          assert payload['status'] == 'success'
          assert payload['data']['status'] == 'healthy'
          PY
