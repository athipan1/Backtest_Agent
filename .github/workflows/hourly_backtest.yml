name: Hourly Backtest

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Backtest runtime mode; legacy_fixed is research/manual only"
        required: false
        type: choice
        default: "nested_promotion"
        options:
          - nested_promotion
          - legacy_fixed
      symbol:
        description: "Legacy single symbol (used when symbols is blank)"
        required: false
        default: "AAPL"
      symbols:
        description: "Comma-separated symbols to backtest independently"
        required: false
        default: ""
      publish_to_database:
        description: "Publish result to Database_Agent"
        required: false
        default: "true"
      start:
        description: "Historical data start (ISO-8601)"
        required: false
        default: ""
      end:
        description: "Historical data end (ISO-8601); blank uses current UTC time"
        required: false
        default: ""

permissions:
  contents: read

env:
  BACKTEST_MODE: ${{ github.event_name == 'schedule' && 'nested_promotion' || github.event.inputs.mode || 'nested_promotion' }}
  BACKTEST_ENVIRONMENT: ${{ github.event_name == 'schedule' && 'production' || 'research' }}
  BACKTEST_ACCOUNT_ID: ${{ vars.BACKTEST_ACCOUNT_ID || '1' }}
  BACKTEST_SYMBOL: ${{ github.event.inputs.symbol || vars.BACKTEST_SYMBOL || 'AAPL' }}
  BACKTEST_SYMBOLS: ${{ github.event.inputs.symbols || vars.BACKTEST_SYMBOLS || github.event.inputs.symbol || vars.BACKTEST_SYMBOL || 'AAPL' }}
  BACKTEST_MAX_SYMBOLS: ${{ vars.BACKTEST_MAX_SYMBOLS || '10' }}
  BACKTEST_SKILL_ID: ${{ vars.BACKTEST_SKILL_ID || 'hourly-sma-crossover' }}
  BACKTEST_STRATEGY_ID: ${{ vars.BACKTEST_STRATEGY_ID || 'hourly-sma-crossover' }}
  BACKTEST_TIMEFRAME: ${{ vars.BACKTEST_TIMEFRAME || '1d' }}
  BACKTEST_START: ${{ github.event.inputs.start || vars.BACKTEST_START || '' }}
  BACKTEST_END: ${{ github.event.inputs.end || vars.BACKTEST_END || '' }}
  BACKTEST_MINIMUM_BARS: ${{ vars.BACKTEST_MINIMUM_BARS || '252' }}
  BACKTEST_BAR_LIMIT: ${{ vars.BACKTEST_BAR_LIMIT || '10000' }}
  BACKTEST_INITIAL_EQUITY: ${{ vars.BACKTEST_INITIAL_EQUITY || '100000' }}
  BACKTEST_STRATEGY: ${{ vars.BACKTEST_STRATEGY || 'sma_crossover' }}
  BACKTEST_FAST_WINDOW: ${{ vars.BACKTEST_FAST_WINDOW || '2' }}
  BACKTEST_SLOW_WINDOW: ${{ vars.BACKTEST_SLOW_WINDOW || '3' }}
  BACKTEST_FEE_BPS: ${{ vars.BACKTEST_FEE_BPS || '0' }}
  BACKTEST_SLIPPAGE_BPS: ${{ vars.BACKTEST_SLIPPAGE_BPS || '0' }}
  BACKTEST_RISK_PER_TRADE: ${{ vars.BACKTEST_RISK_PER_TRADE || '0.01' }}
  BACKTEST_MAX_POSITION_PCT: ${{ vars.BACKTEST_MAX_POSITION_PCT || '0.10' }}
  BACKTEST_STOP_LOSS_PCT: ${{ vars.BACKTEST_STOP_LOSS_PCT || '0.03' }}
  BACKTEST_REWARD_RISK_RATIO: ${{ vars.BACKTEST_REWARD_RISK_RATIO || '2.0' }}
  BACKTEST_USE_RISK_AGENT: ${{ vars.BACKTEST_USE_RISK_AGENT || 'true' }}
  BACKTEST_MAX_TRADES_PER_DAY: ${{ vars.BACKTEST_MAX_TRADES_PER_DAY || '5' }}
  BACKTEST_EMERGENCY_HALT: ${{ vars.BACKTEST_EMERGENCY_HALT || 'false' }}
  BACKTEST_FORCE_CLOSE_AT_END: ${{ vars.BACKTEST_FORCE_CLOSE_AT_END || 'false' }}
  BACKTEST_MAX_TOTAL_EXPOSURE_PCT: ${{ vars.BACKTEST_MAX_TOTAL_EXPOSURE_PCT || '1.0' }}
  BACKTEST_MAX_OPEN_POSITIONS: ${{ vars.BACKTEST_MAX_OPEN_POSITIONS || '25' }}
  BACKTEST_CASH_RESERVE_PCT: ${{ vars.BACKTEST_CASH_RESERVE_PCT || '0.0' }}
  BACKTEST_MAX_NEW_POSITIONS_PER_BAR: ${{ vars.BACKTEST_MAX_NEW_POSITIONS_PER_BAR || '25' }}
  BACKTEST_PERIODS_PER_YEAR: ${{ vars.BACKTEST_PERIODS_PER_YEAR || '252' }}
  BACKTEST_ANNUAL_RISK_FREE_RATE: ${{ vars.BACKTEST_ANNUAL_RISK_FREE_RATE || '0.0' }}
  BACKTEST_MAX_VOLUME_PARTICIPATION_PCT: ${{ vars.BACKTEST_MAX_VOLUME_PARTICIPATION_PCT || '1.0' }}
  BACKTEST_MARKET_IMPACT_BPS: ${{ vars.BACKTEST_MARKET_IMPACT_BPS || '0.0' }}
  PUBLISH_TO_DATABASE: ${{ github.event.inputs.publish_to_database || vars.PUBLISH_TO_DATABASE || 'true' }}
  DATABASE_AGENT_URL: ${{ secrets.DATABASE_AGENT_URL }}
  DATABASE_AGENT_API_KEY: ${{ secrets.DATABASE_AGENT_API_KEY }}
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  ALPACA_DATA_API_URL: ${{ vars.ALPACA_DATA_API_URL || 'https://data.alpaca.markets' }}
  ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}

jobs:
  hourly-backtest:
    name: Run hourly backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hourly-backtest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests first
        env:
          BACKTEST_ENV: test
          PUBLISH_TO_DATABASE: "false"
          DATABASE_AGENT_URL: ""
          DATABASE_AGENT_API_KEY: ""
        run: PYTHONPATH=. python -m pytest -q

      - name: Verify Database_Agent connectivity
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          import httpx

          base_url = os.getenv("DATABASE_AGENT_URL", "").strip().rstrip("/")
          api_key = os.getenv("DATABASE_AGENT_API_KEY", "").strip()
          if not base_url:
              raise SystemExit("DATABASE_AGENT_URL is not configured")
          parsed = urlparse(base_url)
          if parsed.scheme not in {"http", "https"} or not parsed.netloc:
              raise SystemExit("DATABASE_AGENT_URL must be an absolute http(s) URL")
          if not api_key:
              raise SystemExit("DATABASE_AGENT_API_KEY is not configured")

          correlation_id = f"backtest-db-preflight-{os.getenv('GITHUB_RUN_ID', 'local')}"
          headers = {
              "X-API-KEY": api_key,
              "X-Correlation-ID": correlation_id,
          }

          ready = httpx.get(f"{base_url}/ready", timeout=20.0)
          if ready.status_code != 200:
              raise SystemExit(
                  f"Database_Agent /ready failed: HTTP {ready.status_code}: {ready.text[:500]}"
              )

          probe_id = f"backtest-connection-probe-{os.getenv('GITHUB_RUN_ID', 'local')}"
          probe = httpx.get(
              f"{base_url}/backtests/runs/{probe_id}",
              headers=headers,
              timeout=20.0,
          )
          if probe.status_code != 404:
              raise SystemExit(
                  "Database_Agent authenticated backtest probe failed: "
                  f"HTTP {probe.status_code}: {probe.text[:500]}"
              )

          print("Database_Agent readiness and authenticated backtest route probe passed")
          PY

      - name: Run hourly backtest
        env:
          BACKTEST_DEFAULT_BID_ASK_SPREAD_BPS: ${{ vars.BACKTEST_DEFAULT_BID_ASK_SPREAD_BPS || '2.0' }}
          BACKTEST_DEFAULT_QUANTITY_INCREMENT: ${{ vars.BACKTEST_DEFAULT_QUANTITY_INCREMENT || '1' }}
        run: python scripts/run_hourly_backtest.py

      - name: Upload backtest report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: hourly-backtest-report
          path: reports/
          if-no-files-found: warn
