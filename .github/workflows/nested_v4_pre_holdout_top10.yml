name: Nested v4 Top-10 Pre-Holdout Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BACKTEST_ENVIRONMENT: production
  BACKTEST_TIMEFRAME: '1d'
  BACKTEST_BAR_LIMIT: '10000'
  BACKTEST_INITIAL_EQUITY: '100000'
  BACKTEST_FEE_BPS: '0'
  BACKTEST_SLIPPAGE_BPS: '0'
  BACKTEST_RISK_PER_TRADE: '0.01'
  BACKTEST_MAX_POSITION_PCT: '0.10'
  BACKTEST_STOP_LOSS_PCT: '0.03'
  BACKTEST_REWARD_RISK_RATIO: '2.0'
  BACKTEST_USE_RISK_AGENT: 'true'
  BACKTEST_MAX_TRADES_PER_DAY: '5'
  BACKTEST_EMERGENCY_HALT: 'false'
  BACKTEST_FORCE_CLOSE_AT_END: 'false'
  BACKTEST_MAX_TOTAL_EXPOSURE_PCT: '1.0'
  BACKTEST_MAX_OPEN_POSITIONS: '25'
  BACKTEST_CASH_RESERVE_PCT: '0.0'
  BACKTEST_MAX_NEW_POSITIONS_PER_BAR: '25'
  BACKTEST_PERIODS_PER_YEAR: '252'
  BACKTEST_ANNUAL_RISK_FREE_RATE: '0.0'
  BACKTEST_MAX_VOLUME_PARTICIPATION_PCT: '1.0'
  BACKTEST_MARKET_IMPACT_BPS: '0.0'
  PUBLISH_TO_DATABASE: 'false'
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  ALPACA_DATA_API_URL: ${{ vars.ALPACA_DATA_API_URL || 'https://data.alpaca.markets' }}
  ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}

jobs:
  verify-v4-pre-holdout:
    name: v4 Scanner US Top-10 before sealed holdout
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Backtest_Agent
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout Scanner_Agent
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: athipan1/Scanner_Agent
          path: Scanner_Agent

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run actual v4 Top-10 pre-holdout path
        run: |
          mkdir -p reports
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from app.data_provider import AlpacaMarketDataProvider
          from app.final_holdout import split_sealed_final_holdout
          from app.hourly_promotion_runner import (
              DEFAULT_MINIMUM_BARS,
              _default_date_range,
              _final_holdout_criteria,
              _request_kwargs,
              _selected_candidate,
          )
          from app.multi_strategy import build_run_request
          from app.multi_strategy_walk_forward import WalkForwardMultiStrategyRequest
          from app.nested_validation_v4 import (
              INNER_SELECTION_POLICY,
              INNER_SELECTION_REQUIRED_GATES,
              VALIDATION_PROFILE,
              run_walk_forward_multi_strategy_backtest_v4,
          )
          from app.promotion_robustness import run_promotion_robustness
          from app.risk_engine import run_backtest_with_risk
          from app.statistical_validation import run_statistical_validation

          scanner_path = Path('Scanner_Agent/.github/workflows/scanner-market-smoke-test.yml')
          text = scanner_path.read_text(encoding='utf-8')
          match = re.search(r'SYMBOLS\s*=\s*\[(.*?)\]\s*\n\s*FALLBACK_SOURCES', text, re.S)
          if not match:
              raise SystemExit('Scanner US universe not found')
          symbols = list(dict.fromkeys(re.findall(r'"([A-Z][A-Z0-9.-]{0,19})"', match.group(1))))
          if len(symbols) != 10:
              raise SystemExit(f'Expected 10 Scanner US symbols, got {symbols}')

          provider = AlpacaMarketDataProvider(
              api_key=os.environ['ALPACA_API_KEY_ID'],
              secret_key=os.environ['ALPACA_SECRET_KEY'],
              base_url=os.getenv('ALPACA_DATA_API_URL', 'https://data.alpaca.markets'),
              feed=os.getenv('ALPACA_DATA_FEED', 'iex'),
          )
          timeframe = os.getenv('BACKTEST_TIMEFRAME', '1d')
          start, end = _default_date_range()
          holdout_criteria = _final_holdout_criteria()
          minimum_bars = DEFAULT_MINIMUM_BARS + holdout_criteria.bars
          rows = []

          for symbol in symbols:
              bars = provider.fetch_bars(
                  symbol=symbol,
                  timeframe=timeframe,
                  start=start,
                  end=end,
                  minimum_bars=minimum_bars,
                  limit=int(os.getenv('BACKTEST_BAR_LIMIT', '10000')),
              )
              research_bars, sealed_holdout_bars = split_sealed_final_holdout(
                  bars,
                  criteria=holdout_criteria,
                  minimum_research_bars=DEFAULT_MINIMUM_BARS,
              )
              request = WalkForwardMultiStrategyRequest(
                  **_request_kwargs(symbol=symbol, bars=research_bars)
              )
              selection = run_walk_forward_multi_strategy_backtest_v4(request)
              row = {
                  'symbol': symbol,
                  'selection_status': selection.selection_status,
                  'nested_passed': selection.nested_walk_forward.passed,
                  'nested_stability_score': selection.nested_walk_forward.stability_score,
                  'nested_profitable_window_rate': selection.nested_walk_forward.profitable_window_rate,
                  'nested_median_sharpe_ratio': selection.nested_walk_forward.median_sharpe_ratio,
                  'nested_median_profit_factor': selection.nested_walk_forward.median_profit_factor,
                  'nested_worst_max_drawdown': selection.nested_walk_forward.worst_max_drawdown,
                  'nested_trade_windows': selection.nested_walk_forward.trade_windows,
                  'nested_no_trade_windows': selection.nested_walk_forward.no_trade_windows,
                  'latest_selected_strategy_id': selection.nested_walk_forward.latest_selected_strategy_id,
                  'selected_strategy_id': selection.best_eligible.strategy_id if selection.best_eligible else None,
                  'strict_statistical_passed': None,
                  'robustness_passed': None,
                  'robustness_scenario_pass_rate': None,
                  'pre_holdout_ready': False,
                  'sealed_holdout_status': 'sealed_not_opened',
                  'sealed_holdout_bar_count': len(sealed_holdout_bars),
                  'database_publish_attempted': False,
              }

              if selection.best_eligible is not None:
                  candidate = _selected_candidate(request, selection.best_eligible.strategy_id)
                  run_request = build_run_request(candidate, request).model_copy(
                      deep=True,
                      update={'force_close_at_end': True},
                  )
                  research_result = run_backtest_with_risk(run_request)
                  statistical = run_statistical_validation(
                      research_result,
                      candidate_count=len(request.candidates),
                      periods_per_year=request.periods_per_year,
                      criteria=request.statistical_criteria,
                  )
                  robustness = run_promotion_robustness(run_request)
                  statistical_passed = (
                      statistical.status == 'completed'
                      and statistical.passed is True
                      and bool(statistical.gates)
                      and all(statistical.gates.values())
                  )
                  robustness_passed = (
                      robustness.status == 'completed'
                      and robustness.passed is True
                      and bool(robustness.gates)
                      and all(robustness.gates.values())
                  )
                  row.update({
                      'strict_statistical_passed': statistical_passed,
                      'strict_statistical_failed_gates': [
                          key for key, passed in statistical.gates.items() if not passed
                      ],
                      'robustness_passed': robustness_passed,
                      'robustness_failed_gates': [
                          key for key, passed in robustness.gates.items() if not passed
                      ],
                      'robustness_scenario_pass_rate': robustness.scenario_pass_rate,
                      'pre_holdout_ready': statistical_passed and robustness_passed,
                      'research_metrics': {
                          'trade_count': research_result.metrics.trade_count,
                          'return_pct': research_result.metrics.return_pct,
                          'annualized_return': research_result.metrics.annualized_return,
                          'sharpe_ratio': research_result.metrics.sharpe_ratio,
                          'profit_factor': research_result.metrics.profit_factor,
                          'max_drawdown': research_result.metrics.max_drawdown,
                          'benchmark_return_pct': research_result.metrics.benchmark_return_pct,
                          'excess_return_pct': research_result.metrics.excess_return_pct,
                      },
                  })
              rows.append(row)

          pre_holdout_ready = [row['symbol'] for row in rows if row['pre_holdout_ready']]
          evidence = {
              'status': 'success',
              'github_run_id': os.getenv('GITHUB_RUN_ID'),
              'scanner_commit': subprocess.check_output(
                  ['git', '-C', 'Scanner_Agent', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'symbols': symbols,
              'validation_profile': VALIDATION_PROFILE,
              'inner_selection_policy': INNER_SELECTION_POLICY,
              'inner_selection_required_gates': list(INNER_SELECTION_REQUIRED_GATES),
              'history_days': 1825,
              'sealed_holdout_opened': False,
              'database_publish_attempted': False,
              'pre_holdout_ready_symbols': pre_holdout_ready,
              'rows': rows,
          }
          Path('reports/nested-v4-top10-pre-holdout.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps({
              'validation_profile': VALIDATION_PROFILE,
              'pre_holdout_ready_symbols': pre_holdout_ready,
              'summary': rows,
          }, indent=2))

          if VALIDATION_PROFILE != 'nested_walk_forward_v4':
              raise SystemExit('Unexpected validation profile')
          if not pre_holdout_ready:
              raise SystemExit('No symbol reached strict v4 pre-holdout readiness')
          if any(row['sealed_holdout_status'] != 'sealed_not_opened' for row in rows):
              raise SystemExit('Sealed final holdout was unexpectedly opened')
          if any(row['database_publish_attempted'] for row in rows):
              raise SystemExit('Database publication was unexpectedly attempted')
          PY

      - name: Upload v4 pre-holdout evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nested-v4-top10-pre-holdout-${{ github.run_id }}
          path: reports/nested-v4-top10-pre-holdout.json
          if-no-files-found: error
          retention-days: 30
