name: Post-Merge v4 Production Top-10 Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post_merge_v4_production_top10.yml'

permissions:
  contents: read

env:
  BACKTEST_MODE: nested_promotion
  BACKTEST_ENVIRONMENT: production
  BACKTEST_ACCOUNT_ID: ${{ vars.BACKTEST_ACCOUNT_ID || '1' }}
  BACKTEST_MAX_SYMBOLS: '10'
  BACKTEST_SKILL_ID: ${{ vars.BACKTEST_SKILL_ID || 'hourly-sma-crossover' }}
  BACKTEST_STRATEGY_ID: ${{ vars.BACKTEST_STRATEGY_ID || 'hourly-sma-crossover' }}
  BACKTEST_TIMEFRAME: ${{ vars.BACKTEST_TIMEFRAME || '1d' }}
  BACKTEST_START: ''
  BACKTEST_END: ''
  BACKTEST_BAR_LIMIT: ${{ vars.BACKTEST_BAR_LIMIT || '10000' }}
  BACKTEST_INITIAL_EQUITY: ${{ vars.BACKTEST_INITIAL_EQUITY || '100000' }}
  BACKTEST_FEE_BPS: ${{ vars.BACKTEST_FEE_BPS || '0' }}
  BACKTEST_SLIPPAGE_BPS: ${{ vars.BACKTEST_SLIPPAGE_BPS || '0' }}
  BACKTEST_RISK_PER_TRADE: ${{ vars.BACKTEST_RISK_PER_TRADE || '0.01' }}
  BACKTEST_MAX_POSITION_PCT: ${{ vars.BACKTEST_MAX_POSITION_PCT || '0.10' }}
  BACKTEST_STOP_LOSS_PCT: ${{ vars.BACKTEST_STOP_LOSS_PCT || '0.03' }}
  BACKTEST_REWARD_RISK_RATIO: ${{ vars.BACKTEST_REWARD_RISK_RATIO || '2.0' }}
  BACKTEST_USE_RISK_AGENT: ${{ vars.BACKTEST_USE_RISK_AGENT || 'true' }}
  BACKTEST_MAX_TRADES_PER_DAY: ${{ vars.BACKTEST_MAX_TRADES_PER_DAY || '5' }}
  BACKTEST_EMERGENCY_HALT: ${{ vars.BACKTEST_EMERGENCY_HALT || 'false' }}
  BACKTEST_FORCE_CLOSE_AT_END: ${{ vars.BACKTEST_FORCE_CLOSE_AT_END || 'false' }}
  BACKTEST_MAX_TOTAL_EXPOSURE_PCT: ${{ vars.BACKTEST_MAX_TOTAL_EXPOSURE_PCT || '1.0' }}
  BACKTEST_MAX_OPEN_POSITIONS: ${{ vars.BACKTEST_MAX_OPEN_POSITIONS || '25' }}
  BACKTEST_CASH_RESERVE_PCT: ${{ vars.BACKTEST_CASH_RESERVE_PCT || '0.0' }}
  BACKTEST_MAX_NEW_POSITIONS_PER_BAR: ${{ vars.BACKTEST_MAX_NEW_POSITIONS_PER_BAR || '25' }}
  BACKTEST_PERIODS_PER_YEAR: ${{ vars.BACKTEST_PERIODS_PER_YEAR || '252' }}
  BACKTEST_ANNUAL_RISK_FREE_RATE: ${{ vars.BACKTEST_ANNUAL_RISK_FREE_RATE || '0.0' }}
  BACKTEST_MAX_VOLUME_PARTICIPATION_PCT: ${{ vars.BACKTEST_MAX_VOLUME_PARTICIPATION_PCT || '1.0' }}
  BACKTEST_MARKET_IMPACT_BPS: ${{ vars.BACKTEST_MARKET_IMPACT_BPS || '0.0' }}
  PUBLISH_TO_DATABASE: 'true'
  DATABASE_AGENT_URL: ${{ secrets.DATABASE_AGENT_URL }}
  DATABASE_AGENT_API_KEY: ${{ secrets.DATABASE_AGENT_API_KEY }}
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  ALPACA_DATA_API_URL: ${{ vars.ALPACA_DATA_API_URL || 'https://data.alpaca.markets' }}
  ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}

jobs:
  production-top10:
    name: Merged-main v4 Top-10 final-holdout and Database proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: post-merge-v4-production-top10
      cancel-in-progress: false

    steps:
      - name: Checkout merged Backtest_Agent main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout Scanner_Agent source universe
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: athipan1/Scanner_Agent
          path: Scanner_Agent

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Load current Scanner US 10-symbol universe
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          source = Path('Scanner_Agent/.github/workflows/scanner-market-smoke-test.yml')
          text = source.read_text(encoding='utf-8')
          match = re.search(r'SYMBOLS\s*=\s*\[(.*?)\]\s*\n\s*FALLBACK_SOURCES', text, re.S)
          if not match:
              raise SystemExit('Could not locate Scanner_Agent US market universe')
          symbols = list(dict.fromkeys(re.findall(r'"([A-Z][A-Z0-9.-]{0,19})"', match.group(1))))
          if len(symbols) != 10:
              raise SystemExit(f'Expected exactly 10 Scanner US symbols, got {symbols}')
          evidence = {
              'scanner_commit': subprocess.check_output(
                  ['git', '-C', 'Scanner_Agent', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'symbols': symbols,
              'source': str(source),
          }
          Path('reports/post-merge-scanner-source.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8'
          )
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('BACKTEST_SYMBOLS=' + ','.join(symbols) + '\n')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Verify Database_Agent before production publication
        run: |
          python - <<'PY'
          import os
          import httpx
          from app.database_client import DatabaseAgentClient

          client = DatabaseAgentClient()
          if not client.base_url or not client.api_key.strip():
              raise SystemExit('Database_Agent URL/API key is not configured')
          ready = httpx.get(f'{client.base_url}/ready', timeout=20.0)
          if ready.status_code != 200:
              raise SystemExit(f'Database_Agent /ready failed: HTTP {ready.status_code}')
          headers = {
              'X-API-KEY': client.api_key.strip(),
              'X-Correlation-ID': f"post-merge-v4-preflight-{os.getenv('GITHUB_RUN_ID', 'local')}",
          }
          probe = httpx.get(
              f"{client.base_url}/backtests/runs/post-merge-v4-probe-{os.getenv('GITHUB_RUN_ID', 'local')}",
              headers=headers,
              timeout=20.0,
          )
          if probe.status_code != 404:
              raise SystemExit(f'Authenticated exact-route probe failed: HTTP {probe.status_code}')
          print('Database_Agent production preflight passed')
          PY

      - name: Run merged-main production v4 Top-10
        id: production_backtest
        continue-on-error: true
        run: python scripts/run_hourly_backtest.py

      - name: Verify final holdout, publication, promotion, and exact Database identity
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import httpx
          from app.database_client import DatabaseAgentClient

          source_path = Path('reports/post-merge-scanner-source.json')
          report_path = Path('reports/hourly-backtest-result.json')
          if not source_path.exists() or not report_path.exists():
              raise SystemExit('Required production evidence files are missing')
          source = json.loads(source_path.read_text(encoding='utf-8'))
          report = json.loads(report_path.read_text(encoding='utf-8'))
          data = report.get('data') or {}
          items = data.get('items') or []
          expected_symbols = source['symbols']

          client = DatabaseAgentClient()
          headers = {
              'X-API-KEY': client.api_key.strip(),
              'X-Correlation-ID': f"post-merge-v4-exact-{os.getenv('GITHUB_RUN_ID', 'local')}",
          }
          evidence_rows = []
          exact_matches = 0
          final_holdout_passes = []
          failures = []

          for item in items:
              symbol = item.get('symbol')
              status = item.get('status')
              row = {
                  'symbol': symbol,
                  'status': status,
                  'selected_strategy_id': item.get('selected_strategy_id'),
                  'run_id': item.get('run_id'),
                  'published': bool(item.get('published')),
                  'promoted': bool(item.get('promoted')),
                  'promotion_state': item.get('promotion_state'),
                  'database_exact_get_proven': False,
                  'error': item.get('error'),
              }
              holdout = item.get('sealed_holdout') or {}
              row['sealed_holdout_status'] = holdout.get('status')
              row['sealed_holdout_passed'] = holdout.get('passed')
              row['sealed_holdout_gates'] = holdout.get('gates')

              if status == 'eligible_strategy_found':
                  if holdout.get('passed') is not True or not holdout.get('gates') or not all(holdout['gates'].values()):
                      failures.append(f'{symbol}: eligible result lacks all-passed sealed holdout evidence')
                  else:
                      final_holdout_passes.append(symbol)
                  if not item.get('published') or not item.get('promoted') or not item.get('run_id'):
                      failures.append(f'{symbol}: eligible result not published/promoted')
                  else:
                      response = httpx.get(
                          f"{client.base_url}/backtests/runs/{item['run_id']}",
                          headers=headers,
                          timeout=30.0,
                      )
                      if response.status_code != 200:
                          failures.append(f'{symbol}: exact Database GET HTTP {response.status_code}')
                      else:
                          body = response.json()
                          stored = ((body.get('data') or {}).get('run') or {})
                          expected = {
                              'run_id': item.get('run_id'),
                              'symbol': symbol,
                              'strategy_id': item.get('selected_strategy_id'),
                              'timeframe': os.getenv('BACKTEST_TIMEFRAME', '1d'),
                          }
                          actual = {key: stored.get(key) for key in expected}
                          if actual != expected:
                              failures.append(
                                  f'{symbol}: exact Database identity mismatch expected={expected} actual={actual}'
                              )
                          else:
                              row['database_exact_get_proven'] = True
                              exact_matches += 1
              elif status == 'no_eligible_strategy':
                  if item.get('published') or item.get('promoted'):
                      failures.append(f'{symbol}: no-eligible result was published/promoted')
                  if holdout.get('status') != 'sealed_not_opened':
                      failures.append(f'{symbol}: no-eligible path unexpectedly opened holdout')
              elif status == 'failed':
                  failures.append(f"{symbol}: {item.get('error') or 'production Backtest failed'}")
              else:
                  failures.append(f'{symbol}: unexpected status {status!r}')
              evidence_rows.append(row)

          summary = {
              'status': report.get('status'),
              'github_run_id': os.getenv('GITHUB_RUN_ID'),
              'backtest_commit': os.getenv('GITHUB_SHA'),
              'scanner_commit': source['scanner_commit'],
              'validation_profile': data.get('validation_profile'),
              'history_days': data.get('history_days'),
              'symbols': data.get('symbols'),
              'eligible_symbols': data.get('eligible_symbols') or [],
              'ineligible_symbols': data.get('ineligible_symbols') or [],
              'failed_symbols': data.get('failed_symbols') or [],
              'published_count': data.get('published_count'),
              'promoted_count': data.get('promoted_count'),
              'final_holdout_pass_symbols': final_holdout_passes,
              'database_exact_match_count': exact_matches,
              'rows': evidence_rows,
              'verification_failures': failures,
          }
          Path('reports/post-merge-v4-production-evidence.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          structural = {
              'validation_profile_v4': data.get('validation_profile') == 'nested_walk_forward_v4',
              'five_year_history': data.get('history_days') == 1825,
              'ten_expected_symbols': data.get('symbols') == expected_symbols and len(items) == 10,
              'selection_complete': data.get('selection_complete') is True,
              'no_operational_failures': data.get('failed_symbols') == [],
          }
          failed_structural = [key for key, passed in structural.items() if not passed]
          if failed_structural:
              failures.append('structural: ' + ', '.join(failed_structural))
          if exact_matches != len(data.get('eligible_symbols') or []):
              failures.append('exact Database proof count does not match eligible count')
          if failures:
              raise SystemExit('Post-merge production verification failed: ' + ' | '.join(failures))
          PY

      - name: Upload merged-main production evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: post-merge-v4-production-top10-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Fail if production runner failed
        if: steps.production_backtest.outcome != 'success'
        run: exit 1
