name: Strategy Research v7

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/pre_holdout_research.py'
      - 'app/parameter_stability.py'
      - 'app/research_candidate_profiles.py'
      - 'app/research_overfit.py'
      - 'app/research_trial_registry.py'
      - 'scripts/run_research_candidate_profile.py'
      - 'tests/test_strategy_research_v7.py'
      - 'tests/test_parameter_stability.py'
      - '.github/workflows/strategy-research-v7.yml'

permissions:
  contents: read

env:
  PYTHONPATH: .
  BACKTEST_RESEARCH_PROFILE: strategy_research_v7
  BACKTEST_MAX_SYMBOLS: '10'
  BACKTEST_TIMEFRAME: '1d'
  BACKTEST_BAR_LIMIT: '10000'
  BACKTEST_NESTED_MINIMUM_BARS: '630'
  BACKTEST_FINAL_HOLDOUT_ENABLED: 'true'
  BACKTEST_FINAL_HOLDOUT_BARS: '252'
  BACKTEST_INITIAL_EQUITY: '100000'
  BACKTEST_FEE_BPS: '1'
  BACKTEST_SLIPPAGE_BPS: '5'
  BACKTEST_RISK_PER_TRADE: '0.01'
  BACKTEST_MAX_POSITION_PCT: '0.10'
  BACKTEST_STOP_LOSS_PCT: '0.03'
  BACKTEST_REWARD_RISK_RATIO: '2.0'
  BACKTEST_USE_RISK_AGENT: 'true'
  BACKTEST_MAX_TRADES_PER_DAY: '5'
  BACKTEST_EMERGENCY_HALT: 'false'
  BACKTEST_FORCE_CLOSE_AT_END: 'false'
  BACKTEST_MAX_TOTAL_EXPOSURE_PCT: '1.0'
  BACKTEST_MAX_OPEN_POSITIONS: '25'
  BACKTEST_CASH_RESERVE_PCT: '0.0'
  BACKTEST_MAX_NEW_POSITIONS_PER_BAR: '25'
  BACKTEST_PERIODS_PER_YEAR: '252'
  BACKTEST_ANNUAL_RISK_FREE_RATE: '0.0'
  BACKTEST_MAX_VOLUME_PARTICIPATION_PCT: '1.0'
  BACKTEST_MARKET_IMPACT_BPS: '2'
  BACKTEST_RESEARCH_PBO_SLICES: '8'
  BACKTEST_RESEARCH_PBO_MIN_OBSERVATIONS_PER_SLICE: '10'
  BACKTEST_RESEARCH_MAX_PBO: '0.20'
  BACKTEST_RESEARCH_COST_STRESS_MULTIPLIERS: '1.0,1.5,2.0'
  BACKTEST_RESEARCH_MIN_FEE_BPS: '1.0'
  BACKTEST_RESEARCH_MIN_SLIPPAGE_BPS: '5.0'
  BACKTEST_RESEARCH_MIN_MARKET_IMPACT_BPS: '2.0'
  PUBLISH_TO_DATABASE: 'false'
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  ALPACA_DATA_API_URL: ${{ vars.ALPACA_DATA_API_URL || 'https://data.alpaca.markets' }}
  ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}

jobs:
  pre-holdout-research:
    name: Scanner Top-10 sealed v7 research
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: strategy-research-v7-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Backtest_Agent
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Checkout Scanner_Agent universe
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: athipan1/Scanner_Agent
          path: Scanner_Agent
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Load current Scanner US 10-symbol universe
        run: |
          mkdir -p reports
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          source = Path('Scanner_Agent/.github/workflows/scanner-market-smoke-test.yml')
          text = source.read_text(encoding='utf-8')
          match = re.search(r'SYMBOLS\s*=\s*\[(.*?)\]\s*\n\s*FALLBACK_SOURCES', text, re.S)
          if not match:
              raise SystemExit('Could not locate Scanner_Agent US market universe')
          symbols = list(dict.fromkeys(re.findall(r'"([A-Z][A-Z0-9.-]{0,19})"', match.group(1))))
          if len(symbols) != 10:
              raise SystemExit(f'Expected exactly 10 Scanner US symbols, got {symbols}')
          evidence = {'scanner_commit': subprocess.check_output(['git','-C','Scanner_Agent','rev-parse','HEAD'], text=True).strip(), 'symbols': symbols, 'source': str(source)}
          Path('reports/strategy-research-v7-scanner.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write('BACKTEST_SYMBOLS=' + ','.join(symbols) + '\n')
          PY
      - name: Run sealed Strategy Research v7
        run: python scripts/run_research_candidate_profile.py
      - name: Verify v7 safety controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/research-candidate-profile-result.json').read_text())
          data=report.get('data') or {}
          profile=data.get('research_profile') or {}
          failures=[]
          checks={
            'success': report.get('status') == 'success',
            'v7': profile.get('profile_id') == 'strategy_research_v7',
            'candidate_count': profile.get('candidate_count') == 8,
            'trials': profile.get('statistical_trial_count') == 18,
            'holdout_closed': data.get('holdout_opened_count') == 0,
            'database_disabled': data.get('database_publish_allowed') is False,
            'promotion_disabled': data.get('promotion_allowed') is False,
            'execution_disabled': data.get('execution_allowed') is False,
            'no_operational_failures': data.get('failed_symbols') == [],
          }
          failures.extend(k for k,v in checks.items() if not v)
          evidence={'checks':checks,'pre_holdout_candidate_symbols':data.get('pre_holdout_candidate_symbols') or [],'failed_symbols':data.get('failed_symbols') or [],'holdout_opened_count':data.get('holdout_opened_count')}
          Path('reports/strategy-research-v7-evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True))
          if failures:
              raise SystemExit('v7 verification failed: '+', '.join(failures))
          PY
      - name: Upload Strategy Research v7 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: strategy-research-v7-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
