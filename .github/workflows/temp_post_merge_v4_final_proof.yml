name: Temporary v4 Exact Persistence Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp_post_merge_v4_final_proof.yml'

permissions:
  contents: read

env:
  DATABASE_AGENT_URL: ${{ secrets.DATABASE_AGENT_URL }}
  DATABASE_AGENT_API_KEY: ${{ secrets.DATABASE_AGENT_API_KEY }}
  EXPECTED_RUN_ID: backtest-walk-forward-be61229484d9d357e4e10615
  EXPECTED_SYMBOL: NVDA
  EXPECTED_STRATEGY_ID: sma-crossover-balanced-v1
  EXPECTED_TIMEFRAME: 1d

jobs:
  exact-persistence:
    name: Read-only exact Database persistence proof
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify persisted NVDA v4 Backtest run
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = (os.environ.get('DATABASE_AGENT_URL') or '').strip().rstrip('/')
          if base and not base.startswith(('http://', 'https://')):
              base = 'https://' + base
          key = (os.environ.get('DATABASE_AGENT_API_KEY') or '').strip()
          expected = {
              'run_id': os.environ['EXPECTED_RUN_ID'],
              'symbol': os.environ['EXPECTED_SYMBOL'],
              'strategy_id': os.environ['EXPECTED_STRATEGY_ID'],
              'timeframe': os.environ['EXPECTED_TIMEFRAME'],
          }
          if not base or not key:
              raise SystemExit('Database_Agent URL/API key is not configured')

          def get_json(path, correlation):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      'X-API-KEY': key,
                      'X-Correlation-ID': correlation,
                      'Accept': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode('utf-8')
                      return resp.status, json.loads(raw)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'Database_Agent HTTP {exc.code}: {raw[:300]}')

          ready_req = urllib.request.Request(base + '/ready', headers={'Accept': 'application/json'})
          with urllib.request.urlopen(ready_req, timeout=20) as ready:
              if ready.status != 200:
                  raise SystemExit(f'Database_Agent /ready HTTP {ready.status}')

          status, body = get_json(
              '/backtests/runs/' + expected['run_id'],
              'temp-v4-readonly-' + os.environ.get('GITHUB_RUN_ID', 'local'),
          )
          if status != 200:
              raise SystemExit(f'Exact GET HTTP {status}')

          matches = []
          def walk(value, path='$'):
              if isinstance(value, dict):
                  if value.get('run_id') == expected['run_id']:
                      matches.append((path, value))
                  for name, child in value.items():
                      walk(child, f'{path}.{name}')
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f'{path}[{index}]')
          walk(body)

          exact_matches = []
          for path, record in matches:
              actual = {name: record.get(name) for name in expected}
              if actual == expected:
                  exact_matches.append((path, record))

          top_keys = sorted(body.keys()) if isinstance(body, dict) else []
          data = body.get('data') if isinstance(body, dict) else None
          data_keys = sorted(data.keys()) if isinstance(data, dict) else []
          evidence = {
              'http_status': status,
              'top_level_keys': top_keys,
              'data_type': type(data).__name__,
              'data_keys': data_keys,
              'matching_run_id_paths': [path for path, _ in matches],
              'exact_identity_paths': [path for path, _ in exact_matches],
              'expected_identity': expected,
              'exact_identity_verified': bool(exact_matches),
          }
          if exact_matches:
              path, record = exact_matches[0]
              metadata = record.get('metadata') if isinstance(record.get('metadata'), dict) else {}
              metrics = record.get('metrics') if isinstance(record.get('metrics'), dict) else {}
              evidence['stored_record_summary'] = {
                  **expected,
                  'status': record.get('status'),
                  'engine_version': record.get('engine_version'),
                  'source_agent': record.get('source_agent'),
                  'validation_profile': metadata.get('validation_profile'),
                  'storage_only': metadata.get('storage_only'),
                  'return_pct': metrics.get('return_pct'),
                  'trade_count': metrics.get('trade_count'),
                  'sharpe_ratio': metrics.get('sharpe_ratio'),
                  'max_drawdown': metrics.get('max_drawdown'),
              }

          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/exact-persistence-proof.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if not exact_matches:
              raise SystemExit('Exact persisted identity was not found in the HTTP 200 response')
          PY

      - name: Upload sanitized exact-persistence evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: temp-v4-exact-persistence-${{ github.run_id }}
          path: evidence/exact-persistence-proof.json
          if-no-files-found: error
          retention-days: 30
