name: Trivy Security Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filesystem-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install verified Trivy CLI once
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Show scanner identity
        run: trivy --version

      - name: Scan repository dependencies, secrets, and configuration
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            .

      - name: Build production image
        run: docker build --pull --no-cache -t backtest-agent-trivy:${{ github.sha }} .

      - name: Verify image operating system and identity
        run: |
          docker image inspect backtest-agent-trivy:${{ github.sha }} \
            --format 'image={{.Id}} user={{.Config.User}}'
          docker run --rm --entrypoint sh \
            backtest-agent-trivy:${{ github.sha }} \
            -c 'cat /etc/os-release && grep -q "^ID=debian$" /etc/os-release'

      - name: Scan the explicit production image to JSON evidence
        run: |
          trivy image \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format json \
            --output trivy-image.json \
            backtest-agent-trivy:${{ github.sha }}

      - name: Report and block HIGH or CRITICAL image findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-image.json").read_text(encoding="utf-8"))
          findings = []
          targets = []
          for result in report.get("Results") or []:
              target = result.get("Target") or "unknown-target"
              class_name = result.get("Class") or "unknown-class"
              type_name = result.get("Type") or "unknown-type"
              targets.append(f"{target} [{class_name}/{type_name}]")
              for item in result.get("Vulnerabilities") or []:
                  findings.append(
                      {
                          "kind": "vulnerability",
                          "target": target,
                          "severity": item.get("Severity"),
                          "id": item.get("VulnerabilityID"),
                          "package": item.get("PkgName"),
                          "installed": item.get("InstalledVersion"),
                          "fixed": item.get("FixedVersion"),
                          "title": item.get("Title"),
                      }
                  )
              for item in result.get("Misconfigurations") or []:
                  findings.append(
                      {
                          "kind": "misconfiguration",
                          "target": target,
                          "severity": item.get("Severity"),
                          "id": item.get("ID"),
                          "package": item.get("Type"),
                          "installed": None,
                          "fixed": item.get("Resolution"),
                          "title": item.get("Title"),
                      }
                  )
              for item in result.get("Secrets") or []:
                  findings.append(
                      {
                          "kind": "secret",
                          "target": target,
                          "severity": item.get("Severity"),
                          "id": item.get("RuleID"),
                          "package": item.get("Category"),
                          "installed": None,
                          "fixed": "remove secret from image",
                          "title": item.get("Title"),
                      }
                  )

          print("Trivy image targets:")
          for target in targets:
              print(f"- {target}")
          assert any("debian" in target.lower() for target in targets), (
              "Trivy did not report the expected Debian operating-system target"
          )

          blocking = [
              item
              for item in findings
              if item.get("severity") in {"HIGH", "CRITICAL"}
          ]
          if blocking:
              print("Blocking Trivy image findings:")
              for item in blocking:
                  print(
                      " | ".join(
                          str(item.get(key) or "-")
                          for key in (
                              "severity",
                              "kind",
                              "target",
                              "package",
                              "installed",
                              "id",
                              "fixed",
                              "title",
                          )
                      )
                  )
              raise SystemExit(
                  f"Trivy found {len(blocking)} HIGH/CRITICAL image finding(s)"
              )
          print("No fixed HIGH/CRITICAL vulnerabilities, secrets, or misconfigurations found")
          PY

      - name: Upload Trivy image evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: backtest-trivy-image-${{ github.sha }}
          path: trivy-image.json
          if-no-files-found: error
          retention-days: 30
